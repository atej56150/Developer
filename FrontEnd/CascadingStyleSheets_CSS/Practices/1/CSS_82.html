<html>
    <head>
        <title> CSS Transformations </title>
        <style>
            *{
                margin: 0;
                box-sizing: border-box;
            }
            body{
                background: red;
            }

            @media only screen and (min-width:800px){
                body{
                    background: green;
                }
            }
            
        </style>
    </head>
    <body>
        <header id="header">
            <div class="header">
                <h1>Welcome to CSS media queries</h1>
            </div>
        </header>
    </body>
</html>
