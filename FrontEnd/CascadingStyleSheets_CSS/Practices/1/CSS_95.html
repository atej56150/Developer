<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example of Div Tag</title>
    <style>
        .container {
            width: 80%;
            margin: auto;
            background-color: #f0f0f0;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
        }
        .content {
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Welcome to My Website</h1>
    </div>
    <div class="content">
        <p>This is a simple example of using the <code>&lt;div&gt;</code> tag to structure a webpage.</p>
    </div>
</div>

</body>
</html>
