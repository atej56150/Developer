<html>
    <head>
        <title> CSS </title>
        <style>
            *{
                margin: 0;
                box-sizing: border-box;
            }
            .register{
                width: 60%;
                margin: auto;
                background: #c65b5b;
                padding: 40px;
            }
            .formcontrol{
                width: 100%;
                height: 36px;
                border-radius: 10px;
                border: 5px solid green;
            }
            .formgroup{
                padding: 10px 0px;
            }
            .btn {
                padding: 12px 24px;
                border: none;
                background-color: blue;
                color: darkorange;
                border-radius: 200px;
            }
            .btn:hover{
                background: #f706be;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <section class="register">
            <h1>Register Here</h1>
            <form method="POST" action="">

                <div class="formgroup">
                    <label for="uname">Username</label>
                    <input type="text" name="uname" id="uname" class="formcontrol" />
                </div>

                <div class="formgroup">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" class="formcontrol" />
                </div>

                <div class="formgroup">
                    <label for="password">Username</label>
                    <input type="text" name="password" id="password" class="formcontrol" />
                </div>

                <div class="formgroup">
                    <label>Gender : </label>
                    <label><input type="radio" name="gender" value="Male" /> Male </label>
                    <label><input type="radio" name="gender" value="Female" /> Female </label>
                </div>

                <div class="formgroup">
                    <input type="submit" value="Register" class="btn" />
                </div>

            </form>
        </section>    
    </body>
</html>
