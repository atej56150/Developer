<html>
    <head>
        <title> CSS Transformations </title>
        <style>
            *{
                margin: 0;
                box-sizing: border-box;
            }
            #header{
                background: #eee;
                padding: 100px;
            }
            .btn{
                padding: 10px 24px;
                border: none;
                background: green;
                color: #fff;
                border-radius: 6px;
                animation: example 3s infinite linear;
            }

            @keyframes example
            {
                from {
                    transform: scale(1.8);
                    box-shadow: 5px 5px 15px #6e07e5;
                }
                to{
                    transform: scale(0.4);
                    box-shadow: 5px 5px 15px #6e07e5;
                }
            }
        </style>
    </head>
    <body>
        <header id="header">
            <button class="btn">Click Here to Pay</button>
        </header>
    </body>
</html>
