<html>
    <head>
        <title> CSS Transformations </title>
        <style>
            *{
                margin: 0;
                box-sizing: border-box;
            }
            #header{
                background: #eee;
                padding: 100px;
            }
            .header{
                height: 100px;
                width: 100px;
                background: #fff;
                border: 2px solid #333;
                transition: transform 3s;
            }
            .header:hover{
                transform: rotate(-360deg);
            }
        </style>
    </head>
    <body>
        <header id="header">
            <div class="header">

            </div>
        </header>
    </body>
</html>
