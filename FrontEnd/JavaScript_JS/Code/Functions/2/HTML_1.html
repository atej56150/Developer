<!DOCTYPE html>
<html>
<body>
  <p id="counter">0</p>
  <button onclick="increment()">+1</button>

  <script>
    let count = 0;
    function increment() {
      count++;
      document.getElementById("counter").innerHTML = count;
//    document.getElementById("counter").textContent = count;
    }
  </script>
</body>
</html>
