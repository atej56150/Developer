<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Link Generator</h2>

<p id="demo"></p>

<script>
let text;
const date = new Date();
const minutes = date.getMinutes();

if (minutes % 2 === 0) {  
  text = "<a href='https://w3schools.com' target='_blank'>Visit W3Schools</a>";
} 
else {  
  text = "<a href='https://wwf.org' target='_blank'>Visit WWF</a>";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
