<!-- Global Variables -->

<!-- var allow redeclaration -->

<html>
<head>
   <title> Variables with var keyword </title>
</head>
<body>
   <script>
      var age = 10;
      var age;                                                    // it keep the same value from first variable, untill new value assign for second variable
      document.write("age = " + age + "<br>");
   </script>
</body>
</html>
