<!-- Global Variables & function {} scope -->

<html>
<head>
   <title> Variable declaration with const keyword </title>
</head>
<body>
   <script>
		let x = 10;
		var y = 20;
		const z = 30;
		function test() {
			let x = 50;
			var y = 100;
			const z = 150;
			document.write("x = " + x + ", y = " + y + ", z = " + z + "<br/>");
		}
		document.write("x = " + x + ", y = " + y + ", z = " + z + "<br/><br/>");
		test();
   </script>
</body>
</html>
