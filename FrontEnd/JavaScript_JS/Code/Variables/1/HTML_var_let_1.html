<!-- Global Variables & function {} scope -->

<html>
<head>
   <title> Variable declaration </title>
</head>
<body>
   <script>
      let x = 10;
	  var y = 20;
	  function test() {
	    let x = 50;
	    var y = 100;
	    document.write("x = " + x + ", y = " + y + "<br/>");
	  }
      document.write("x = " + x + ", y = " + y + "<br/><br/>");
	  test();
   </script>
</body>
</html>
