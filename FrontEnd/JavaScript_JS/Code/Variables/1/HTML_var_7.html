<!-- Global Variables & function {} scope -->

<html>
<head>
   <title> JavaScript Variable Scope Example</title>
</head>
<body>   
   <script>
        var myVar = "global";                             // Declare a global variable
        function checkscope( ) {
            var myVar = "local";                          // Declare a local variable
            document.write(myVar);
        }
        checkscope ( )
        document.write(myVar)
   </script>     
</body>
</html>
