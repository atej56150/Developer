<!-- function {} scope -->

<html>
<head>
   <title> Variable hoisting </title>
</head>
<body>
   <script>
      function test() {
         let m;
         m = 100;
         document.write("m = " + m + "<br/>");
         
         n = 50;
         document.write("n = " + n + "<br/>");
         var n;
      }
      test();
   </script>
</body>
</html>
