<!-- Global Variables -->

<!-- let allow reassignment -->

<html>
<head>
   <title> Variables with let keyword </title>
</head>
<body>
   <script>
      let age = 10;
      age = 20;                                             // ✅ Reassignment (no 'let' keyword)
      document.write("age = " + age + "<br>"); 
   </script>
</body>
</html>
