<!-- function {} scope -->

<html>
<head>
   <title> Variable redeclaring </title>
</head>
<body>
   <script>
		function test() {
			if (1) {
				const m = 70;
				// const m = 80; // redeclaration with const keyword is not	possible
				var n = 80;
				var n = 90; // redeclaration with var keyword is possible
				document.write("m = " + m + ", n = " + n);
			}
		}
		test();
   </script>
</body>
</html>
