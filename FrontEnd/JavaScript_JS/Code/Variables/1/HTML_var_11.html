<!-- Global Variables -->

<html>
   <head>
      <title> Variables with var keyword </title>
   </head>
   <body>
      <script>
         var score = 100;     
         var score;           
         document.write(score); 

         document.write("<br>")

         var name = "Alice";
         var name = undefined; 
         document.write(name); 
      </script>
   </body>
</html>
